<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Makkah Food Catering &amp; Supply Forum logo</title>
  <g fill="none" stroke="#E1A63E" stroke-linecap="round" stroke-linejoin="round">
    <!-- Gathered chef's-hat crown -->
    <path d="M128 250
             C 100 230, 91 195, 111 167
             C 131 139, 166 129, 194 143
             C 199 108, 227 86, 262 86
             C 299 86, 327 108, 333 143
             C 365 135, 399 155, 409 187
             C 419 219, 401 249, 372 261"
          stroke-width="20" />
    <!-- Hat band -->
    <rect x="170" y="250" width="198" height="52" rx="17" stroke-width="18" />
    <path d="M186 276 C 244 284, 300 284, 352 276" stroke-width="9" opacity="0.85" />
    <!-- Ribbon between the hat and the letterform -->
    <path d="M150 326 C 224 344, 300 342, 364 322" stroke-width="12" />
    <!-- Terminal curl of the crown -->
    <path d="M333 143 C 353 151, 366 169, 368 191" stroke-width="14" />
  </g>

  <!-- Gold terminal at the base of the left stem -->
  <rect x="122" y="444" width="38" height="38" rx="5" fill="#E1A63E" />

  <!-- Lowercase “m”: the hat rests on the letterform -->
  <g fill="none" stroke="#1E2A5A" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M158 456 L158 366 C158 347, 172 335, 189 335 C206 335, 220 347, 220 366 L220 456" />
    <path d="M220 380 C220 353, 238 335, 261 335 C284 335, 302 353, 302 371 L302 456" />
  </g>
</svg>
